<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croquis ACHS · Avance por región</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2b; --panel2:#0e1626; --line:#1e293b;
    --txt:#e6edf6; --muted:#8a99ad; --accent:#7aa2ff;
    --term:#34d399; --pen:#fbbf24; --rev:#f87171; --none:#1b2433;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 80% -10%, #14223b 0%, var(--bg) 55%);
    color:var(--txt); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    padding:28px clamp(16px,4vw,48px);
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
  h1{font-size:clamp(20px,2.6vw,28px);font-weight:600;letter-spacing:-.02em;margin:0}
  h1 span{color:var(--muted);font-weight:400}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .nav{margin-top:10px;font-size:12.5px}
  .nav a{color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:5px 11px;border-radius:9px;background:var(--panel)}
  .nav a:hover{border-color:var(--accent)}
  .meta{display:flex;flex-direction:column;gap:4px;text-align:right;font-size:12.5px;color:var(--muted)}
  .meta b{color:var(--txt);font-weight:600;font-family:'IBM Plex Mono',monospace}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
  .chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:10px 14px;min-width:128px}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip .k{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .chip .v{font-size:20px;font-weight:600;font-family:'IBM Plex Mono',monospace;line-height:1}
  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
        border:1px solid var(--line);border-radius:18px;padding:18px clamp(12px,2vw,24px) 20px;
        box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
  .grid{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .mapbox{display:flex;justify-content:center}
  svg{height:78vh;max-height:1010px;width:auto;display:block;overflow:hidden}
  path.region{stroke:#0b1220;stroke-width:.5;transition:fill .15s,stroke .15s,filter .15s;cursor:default}
  path.region:hover{stroke:#fff;stroke-width:1.2;filter:brightness(1.13)}
  .list{display:flex;flex-direction:column;gap:2px}
  .lrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
        padding:7px 8px;border-radius:9px;transition:background .12s}
  .lrow:hover,.lrow.hl{background:rgba(122,162,255,.10)}
  .lrow .rc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right}
  .lrow .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .nm .tot{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:6px;font-family:'IBM Plex Mono',monospace}
  .lrow .bar{width:130px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:#0c1424;border:1px solid var(--line)}
  .lrow .bar i{display:block;height:100%}
  .lrow.empty .nm{color:var(--muted);font-weight:400}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .legend .it{display:flex;align-items:center;gap:8px}
  .legend .sw{width:13px;height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.12)}
  .tip{position:fixed;pointer-events:none;z-index:30;opacity:0;transition:opacity .12s;
       background:rgba(13,20,34,.97);border:1px solid #2a3a55;border-radius:12px;
       padding:12px 14px;min-width:200px;max-width:290px;
       box-shadow:0 18px 40px -16px rgba(0,0,0,.8);backdrop-filter:blur(4px)}
  .tip h3{margin:0 0 8px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .tip .row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12.5px;margin:3px 0}
  .tip .row .lab{display:flex;align-items:center;gap:7px;color:var(--muted)}
  .tip .row .lab .d{width:8px;height:8px;border-radius:50%}
  .tip .row .num{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--txt)}
  .tip .folios{margin-top:7px;padding-top:8px;border-top:1px solid #22324c}
  .tip .folios .ft{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--rev);margin-bottom:5px}
  .tip .folios .fl{display:flex;flex-wrap:wrap;gap:5px}
  .tip .folios .fl span{font-family:'IBM Plex Mono',monospace;font-size:11px;
       background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fecaca;border-radius:6px;padding:2px 6px}
  .tip .empty{font-size:12px;color:var(--muted);font-style:italic}
  footer{margin-top:18px;text-align:center;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Croquis ACHS · <span>Avance por región</span></h1>
      <div class="sub">Estado de levantamiento de croquis por región — pase el cursor sobre el mapa o la lista</div>
      <div class="nav"><a href="https://ceel-uc.github.io/Dashboards">Ver detalle Región Metropolitana &rarr;</a></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="card">
    <div class="grid">
      <div class="mapbox"><svg id="map" viewBox="0 0 200 1006" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div>
        <div class="list" id="list"></div>
        <div class="legend">
          <div class="it"><span class="sw" style="background:var(--term)"></span>Terminado</div>
          <div class="it"><span class="sw" style="background:var(--pen)"></span>Pendiente</div>
          <div class="it"><span class="sw" style="background:var(--rev)"></span>Por revisar</div>
          <div class="it"><span class="sw" style="background:var(--none)"></span>Sin folios</div>
        </div>
      </div>
    </div>
  </div>
  <footer>CEEL UC · Empadronamiento ACHS — datos derivados de la carpeta de croquis</footer>
</div>

document.getElementById('chips').innerHTML =
  chip('var(--accent)','Regiones con folios',META.regiones) +
  chip(COLORS.term,'Terminados',META.t) +
  chip(COLORS.pen,'Pendientes',META.p) +
  chip(COLORS.rev,'Por revisar',META.r);
function chip(c,k,v){
  return '<div class="chip"><span class="dot" style="background:'+c+'"></span>'+
         '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div></div>';
}

// --- mapa ---
const W=200, H=1006;
const svg = d3.select('#map');
const BBOX = {type:'Feature',geometry:{type:'Polygon',coordinates:[[[-76,-17.4],[-66,-17.4],[-66,-56],[-76,-56],[-76,-17.4]]]}};
const proj = d3.geoMercator().fitExtent([[6,6],[W-6,H-6]], BBOX);
const path = d3.geoPath(proj);
const tip = document.getElementById('tip');

svg.selectAll('path').data(GEO.features).join('path')
  .attr('class','region')
  .attr('data-cod', d => d.properties.codregion)
  .attr('d', path)
  .attr('fill', d => COLORS[statusOf(dmap[d.properties.codregion])])
  .on('mousemove', (ev,d) => showTip(ev, d.properties.codregion, d.properties.Region))
  .on('mouseleave', clearHl);

// --- lista ---
const listEl = document.getElementById('list');
let rows = '';
ORDER.forEach(cod => {
  const d = dmap[cod];
  const nm = shortName(nameByCod[cod] || ('Región '+cod));
  const t=(d&&d.t)||0, p=(d&&d.p)||0, r=(d&&d.r)||0, tot=t+p+r;
  let bar='';
  if(tot>0){
    const w=x=>(100*x/tot).toFixed(2)+'%';
    if(t>0) bar+='<i style="width:'+w(t)+';background:'+COLORS.term+'"></i>';
    if(p>0) bar+='<i style="width:'+w(p)+';background:'+COLORS.pen+'"></i>';
    if(r>0) bar+='<i style="width:'+w(r)+';background:'+COLORS.rev+'"></i>';
  }
  rows += '<div class="lrow'+(tot===0?' empty':'')+'" data-cod="'+cod+'" '+
          'onmousemove="rowTip(event,'+cod+')" onmouseleave="clearHl()">'+
          '<div class="rc">'+cod+'</div>'+
          '<div class="nm">'+nm+(tot>0?'<span class="tot">'+tot+'</span>':'')+'</div>'+
          '<div class="bar">'+bar+'</div></div>';
});
listEl.innerHTML = rows;

function tipHtml(cod, regName){
  const d = dmap[cod];
  const nm = regName || nameByCod[cod] || ('Región '+cod);
  let html = '<h3>'+nm+'</h3>';
  if(!d || (d.t+d.p+d.r)===0){ html += '<div class="empty">Sin folios cargados</div>'; return html; }
  const tot=d.t+d.p+d.r;
  html += '<div class="row"><span class="lab">Total folios</span><span class="num">'+tot+'</span></div>';
  html += '<div class="row"><span class="lab"><span class="d" style="background:'+COLORS.term+'"></span>Terminados</span><span class="num">'+d.t+'</span></div>';
  html += '<div class="row"><span class="lab"><span class="d" style="background:'+COLORS.pen+'"></span>Pendientes</span><span class="num">'+d.p+'</span></div>';
  html += '<div class="row"><span class="lab"><span class="d" style="background:'+COLORS.rev+'"></span>Por revisar</span><span class="num">'+d.r+'</span></div>';
  if(d.r>0){
    const fl=(d.folios_r||[]).map(x=>'<span>'+x+'</span>').join('');
    html += '<div class="folios"><div class="ft">Folios por revisar</div><div class="fl">'+fl+'</div></div>';
  }
  return html;
}
function place(ev){
  const pad=14, tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY+pad;
  if(x+tw>window.innerWidth-8)  x=ev.clientX-tw-pad;
  if(y+th>window.innerHeight-8) y=ev.clientY-th-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function highlight(cod){
  document.querySelectorAll('.lrow').forEach(el=>el.classList.toggle('hl', +el.dataset.cod===cod));
  svg.selectAll('path').attr('stroke-width', function(){ return +this.getAttribute('data-cod')===cod?1.4:.5; })
     .attr('stroke', function(){ return +this.getAttribute('data-cod')===cod?'#fff':'#0b1220'; });
}
function showTip(ev, cod, regName){ tip.innerHTML=tipHtml(cod,regName); tip.style.opacity=1; place(ev); highlight(cod); }
function rowTip(ev, cod){ showTip(ev, cod, null); }
function clearHl(){ tip.style.opacity=0; highlight(-1); }
window.rowTip = rowTip; window.clearHl = clearHl;
</script>
</body>
</html>
